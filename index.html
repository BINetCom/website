<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Information de clôture de BINetCom">
    <title>BINetCom — Au revoir</title>
    <style>
        :root { font-family: Arial, Helvetica, sans-serif; color: #172033; background: #edf3ff; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px 18px;
            background:
                radial-gradient(circle at 8% 12%, rgba(255, 212, 93, .40), transparent 25%),
                radial-gradient(circle at 94% 88%, rgba(93, 172, 255, .32), transparent 28%),
                #edf3ff;
        }
        main {
            position: relative;
            width: min(100%, 900px);
            min-height: 600px;
            display: grid;
            grid-template-columns: 1.08fr .92fr;
            align-items: center;
            overflow: hidden;
            padding: clamp(34px, 6vw, 72px);
            background: rgba(255, 255, 255, .94);
            border: 1px solid rgba(215, 225, 242, .95);
            border-radius: 30px;
            box-shadow: 0 24px 70px rgba(42, 72, 122, .16);
        }
        main::before {
            content: "";
            position: absolute;
            z-index: 0;
            inset: 50% auto auto 50%;
            width: min(92%, 760px);
            height: 250px;
            transform: translate(-50%, -50%);
            background: url("images/logo.png") center / contain no-repeat;
            opacity: .075;
            filter: grayscale(1);
            pointer-events: none;
        }
        main::after {
            content: "";
            position: absolute;
            width: 440px;
            height: 440px;
            right: -140px;
            bottom: -180px;
            border-radius: 50%;
            background: #e7f0ff;
            z-index: 0;
        }
        .copy, .scene { position: relative; z-index: 1; }
        .label {
            margin: 0 0 16px;
            color: #315da8;
            font-size: .82rem;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 24px;
            max-width: 520px;
            color: #172033;
            font-size: clamp(2.3rem, 5vw, 4.4rem);
            line-height: 1.02;
        }
        p {
            max-width: 510px;
            margin: 0;
            color: #526079;
            font-size: clamp(1rem, 1.8vw, 1.18rem);
            line-height: 1.75;
        }
        .farewell {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 12px 20px;
            color: #fff;
            background: #315da8;
            border-radius: 999px;
            font-size: 1.12rem;
            font-weight: 800;
            box-shadow: 0 10px 20px rgba(49, 93, 168, .24);
        }
        .scene { display: grid; place-items: center; min-height: 360px; }
        .character { width: min(100%, 330px); height: auto; animation: bob 3s ease-in-out infinite; }
        .wave { transform-box: view-box; transform-origin: 235px 210px; animation: wave 1.2s ease-in-out infinite; }
        @keyframes wave { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-8deg); } }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        @media (prefers-reduced-motion: reduce) { .character, .wave { animation: none; } }
        @media (max-width: 720px) {
            main { grid-template-columns: 1fr; min-height: auto; padding: 34px 24px 28px; text-align: center; }
            p { margin: 0 auto; }
            .farewell { justify-content: center; }
            .scene { min-height: 300px; margin-top: 28px; }
        }
    </style>
</head>
<body>
    <main>
        <section class="copy" aria-labelledby="closure-title">
            <p class="label">Information importante</p>
            <h1 id="closure-title">BINetCom cesse ses activités</h1>
            <p>
                Nous vous informons que BINetCom ferme définitivement ses portes et n'accepte plus de nouvelles demandes.
                Nous remercions sincèrement nos clients, partenaires et visiteurs pour leur confiance et leur soutien.
            </p>
            <div class="farewell">Au revoir, et merci pour tout ! <span aria-hidden="true">✦</span></div>
        </section>
        <section class="scene" aria-label="Personnage souriant qui fait au revoir">
            <svg class="character" viewBox="0 0 340 390" role="img" aria-label="Personnage souriant faisant au revoir">
                <ellipse cx="173" cy="364" rx="112" ry="16" fill="#cbdaf2"/>
                <path d="M105 213 Q170 184 235 213 L258 342 Q171 373 82 342 Z" fill="#315da8"/>
                <path d="M119 222 Q171 241 223 222 L233 329 Q170 348 109 329 Z" fill="#4075c3"/>
                <circle cx="170" cy="139" r="73" fill="#ffd9b5"/>
                <path d="M99 135 Q102 59 172 63 Q243 59 244 136 Q219 105 170 108 Q124 104 99 135Z" fill="#263552"/>
                <path d="M117 98 Q150 43 213 79" fill="none" stroke="#3b4f76" stroke-width="17" stroke-linecap="round"/>
                <circle cx="145" cy="139" r="6" fill="#172033"/><circle cx="196" cy="139" r="6" fill="#172033"/>
                <path d="M151 169 Q170 184 190 169" fill="none" stroke="#b85d62" stroke-width="5" stroke-linecap="round"/>
                <path d="M105 208 Q67 209 53 266" fill="none" stroke="#ffd9b5" stroke-width="24" stroke-linecap="round"/>
                <g class="wave">
                    <path d="M226 207 C249 207 271 216 280 231 C286 242 282 254 273 257 C264 260 258 251 254 242 C249 231 241 224 231 223 L226 222 Z" fill="#ffd9b5"/>
                    <path d="M271 240 C263 231 258 222 258 214 L252 195" fill="none" stroke="#ffd9b5" stroke-width="18" stroke-linecap="round"/>
                    <path d="M258 214 L253 190 M268 218 L265 181 M278 221 L279 181 M287 225 L294 190" fill="none" stroke="#ffd9b5" stroke-width="14" stroke-linecap="round"/>
                </g>
                <path d="M139 342 L127 368 M204 342 L217 368" stroke="#172033" stroke-width="16" stroke-linecap="round"/>
                <path d="M110 368 L139 368 M205 368 L234 368" stroke="#315da8" stroke-width="13" stroke-linecap="round"/>
                <path d="M138 252 Q171 268 204 252" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".75"/>
            </svg>
        </section>
    </main>
</body>
</html>
