<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Information de clôture de BINetCom">
    <title>BINetCom — Information de clôture</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            padding: 32px 20px;
            background: linear-gradient(135deg, #f8fbff 0%, #eef2f8 100%);
        }
        body::before {
            content: "";
            position: fixed;
            z-index: 0;
            inset: 50% auto auto 50%;
            width: min(86vw, 980px);
            height: min(42vw, 360px);
            transform: translate(-50%, -50%);
            background: url("images/logo.png") center / contain no-repeat;
            opacity: 0.055;
            filter: grayscale(1);
            pointer-events: none;
        }
        main {
            position: relative;
            z-index: 1;
            width: min(100%, 720px);
            padding: clamp(40px, 8vw, 76px) clamp(24px, 7vw, 72px);
            text-align: center;
            background: rgba(255, 255, 255, 0.93);
            border: 1px solid rgba(227, 232, 241, 0.9);
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(35, 55, 90, 0.10);
        }
        .label {
            margin: 0 0 18px;
            color: #51617d;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 24px;
            color: #172033;
            font-size: clamp(2rem, 5vw, 3.2rem);
            line-height: 1.12;
        }
        p {
            max-width: 560px;
            margin: 0 auto;
            color: #526079;
            font-size: clamp(1rem, 2vw, 1.18rem);
            line-height: 1.75;
        }
    </style>
</head>
<body>
    <main>
        <p class="label">Information importante</p>
        <h1>BINetCom cesse ses activités</h1>
        <p>
            Nous vous informons que BINetCom ferme définitivement ses portes et n'accepte plus de nouvelles demandes.
            Nous remercions sincèrement nos clients, partenaires et visiteurs pour leur confiance et leur soutien.
        </p>
    </main>
</body>
</html>
